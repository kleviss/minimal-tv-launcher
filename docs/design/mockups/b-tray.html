<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TV Home, direction B: iOS 18 tray</title>
<meta name="description" content="One frosted light tray along the bottom holds every control; the photo above it is left alone.">
<style>
  /* Direction B, "iOS 18 tray". Light frosted material, dark type, one tray. */
  :root{
    --ink:#221c17;                      /* warm near-black for all type on material */
    --ink-soft:rgba(34,28,23,.72);      /* secondary type */
    --mat:rgba(255,255,255,.62);        /* the tray */
    --mat-pill:rgba(255,255,255,.62);   /* pills and chips (same material; on the tray it stacks one step whiter) */
    --mat-lift:rgba(255,255,255,.86);   /* a focused pill */
    --edge:rgba(255,255,255,.45);       /* 1px light inner edge, the only "highlight" allowed */
    --hairline:rgba(34,28,23,.08);      /* keeps white tiles visible on the white tray */
    --blur:24px;
    --netflix:#e50914;
    --youtube:#ff0000;
    --dot-off:#a39a90;
    --dot-on:#2f9e5b;
  }
  html,body{width:1920px;height:1080px;overflow:hidden;margin:0;padding:0}
  body{
    position:relative;
    background:#e8e1d5;
    color:var(--ink);
    font-family:Roboto,"Roboto",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    font-feature-settings:"tnum" 1;
  }

  /* wallpaper and the one scrim, under the top-left text only */
  #wall{position:absolute;inset:0;background-size:cover;background-position:center}
  #scrim{
    position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(1150px 720px at 0 0, rgba(255,255,255,.46), rgba(255,255,255,0) 72%);
  }

  /* the material. translucent + blur + 1px light inner edge. nothing else. */
  .mat{
    background:var(--mat);
    -webkit-backdrop-filter:blur(var(--blur));
    backdrop-filter:blur(var(--blur));
    box-shadow:inset 0 0 0 1px var(--edge);
  }

  /* top left: greeting, clock, date */
  #head{position:absolute;left:96px;top:70px}
  #greet{font-size:34px;line-height:1.2;font-weight:400;color:var(--ink-soft)}
  #clock{font-size:136px;line-height:1;font-weight:300;letter-spacing:-.03em;margin:4px 0 0 -7px}
  #date{font-size:30px;line-height:1.3;font-weight:400;color:var(--ink-soft);margin-top:12px}

  /* top right: three pills */
  #pills{position:absolute;right:96px;top:72px;display:flex;gap:12px}
  .pill{
    display:inline-flex;align-items:center;gap:11px;
    height:56px;padding:0 26px;border-radius:999px;
    font-size:28px;font-weight:500;line-height:1;white-space:nowrap;
    background:var(--mat-pill);
  }
  .pill svg{width:28px;height:28px;flex:none}
  .pill.focused{
    background:var(--mat-lift);
    transform:scale(1.06);
    box-shadow:inset 0 0 0 1px var(--edge), 0 14px 34px rgba(50,35,20,.24);
  }

  /* the tray: sized by its content, no shadow of its own */
  #tray{
    position:absolute;left:96px;right:96px;bottom:64px;
    border-radius:40px;padding:24px 36px 26px;
    box-sizing:border-box;
  }
  .tray-top{display:flex;align-items:center;height:58px}
  #appname{font-size:56px;line-height:1;font-weight:500;letter-spacing:-.012em;margin-left:6px}
  .chip{
    display:inline-flex;align-items:center;gap:12px;
    height:44px;padding:0 20px 0 16px;border-radius:999px;
    font-size:26px;font-weight:400;line-height:1;color:var(--ink);
    background:var(--mat-pill);
  }
  .chip i{width:12px;height:12px;border-radius:50%;background:var(--dot-off);flex:none}
  .chip.on i{background:var(--dot-on)}

  .tray-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:26px}
  .dock{display:flex;align-items:center;gap:22px}

  /* tiles, 16:9, drawn here */
  .tile{
    position:relative;width:360px;height:203px;border-radius:18px;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 1px var(--hairline);
  }
  .tile.focused{
    transform:scale(1.06);
    box-shadow:0 0 0 1px var(--hairline), 0 18px 44px rgba(50,35,20,.30);
    z-index:2;
  }
  .tile.netflix{background:#fff}
  .tile.netflix .mark{
    font-weight:900;font-size:56px;line-height:1;letter-spacing:-.04em;color:var(--netflix);
  }
  .tile.youtube{background:#f8f7f4;gap:12px}
  .tile.youtube svg{width:66px;height:46px;flex:none}
  .tile.youtube .mark{font-weight:500;font-size:48px;line-height:1;letter-spacing:-.03em;color:#1f1f1f}
  .tile.apps{background:var(--mat-pill);box-shadow:inset 0 0 0 1px var(--edge), 0 0 0 1px var(--hairline);flex-direction:column;gap:14px}
  .tile.apps.focused{box-shadow:inset 0 0 0 1px var(--edge), 0 0 0 1px var(--hairline), 0 18px 44px rgba(50,35,20,.30)}
  .grid{display:grid;grid-template-columns:repeat(3,14px);gap:6px}
  .grid b{display:block;width:14px;height:14px;border-radius:4px;background:var(--ink)}
  .tile.apps .label{font-size:28px;font-weight:500;line-height:1;color:var(--ink)}

  /* add app, last item of the dock row */
  .add{padding-left:20px;margin-left:6px}
</style>
</head>
<body>
  <div id="wall"></div>
  <div id="scrim"></div>

  <div id="head">
    <div id="greet">Good afternoon</div>
    <div id="clock">14:16</div>
    <div id="date">Monday 19 October</div>
  </div>

  <div id="pills">
    <div class="pill mat" data-focus="inputs">Inputs</div>
    <div class="pill mat">
      <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M2.5 10.5a17 17 0 0 1 23 0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M6.5 15a11.3 11.3 0 0 1 15 0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M10.5 19.4a5.6 5.6 0 0 1 7 0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="14" cy="23.2" r="1.8" fill="currentColor"/></svg>
      Home Wi-Fi
    </div>
    <div class="pill mat">Settings</div>
  </div>

  <div id="tray" class="mat">
    <div class="tray-top">
      <div id="appname">Netflix</div>
    </div>
    <div class="tray-bottom">
      <div class="dock">
        <div class="tile netflix" data-focus="netflix" data-name="Netflix"><span class="mark">NETFLIX</span></div>
        <div class="tile youtube" data-focus="youtube" data-name="YouTube">
          <svg viewBox="0 0 64 45" aria-hidden="true"><rect x="0" y="0" width="64" height="45" rx="13" fill="#ff0000"/><path d="M25.5 13.5v18l15-9z" fill="#fff"/></svg>
          <span class="mark">YouTube</span>
        </div>
        <div class="tile apps" data-focus="apps" data-name="All apps">
          <div class="grid"><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b></div>
          <div class="label">All apps</div>
        </div>
        <div class="pill add">
          <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M14 5v18M5 14h18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
          Add app
        </div>
      </div>
      <div class="chip mat"><i></i>VPN off</div>
    </div>
  </div>

  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var walls = {
        1: '../wallpapers/placeholder-1-dune.jpg',
        2: '../wallpapers/placeholder-2-ink.jpg',
        3: '../wallpapers/placeholder-3-sage.jpg'
      };
      var wp = parseInt(q.get('wp'), 10);
      if (!walls[wp]) wp = 1 + Math.floor(Math.random() * 3);   /* what the TV does: a random one each power-on */
      document.getElementById('wall').style.backgroundImage = 'url("' + walls[wp] + '")';

      var allowed = ['netflix', 'youtube', 'apps', 'inputs'];
      var focus = q.get('focus');
      if (allowed.indexOf(focus) < 0) focus = 'netflix';
      var el = document.querySelector('[data-focus="' + focus + '"]');
      el.classList.add('focused');
      var name = el.getAttribute('data-name');
      if (name) document.getElementById('appname').textContent = name;
    })();
  </script>
</body>
</html>
